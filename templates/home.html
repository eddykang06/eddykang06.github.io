  <body>
    <main class="page">
      <header class="bio">
        <div class="bio-text">
          <h1 class="name">Eddy Kang</h1>
{{bio}}          <p class="bio-links">
{{links}}          </p>
        </div>
        <div class="bio-photo">
          <a href="images/face.jpg"><img src="images/face.jpg" alt="Eddy Kang"></a>
          <p class="photo-hint" aria-hidden="true"><span class="hint-hover">hover</span><span class="hint-tap">tap</span> to denoise!</p>
        </div>
      </header>

      <section class="section-header">
        <h2>Research</h2>
        <p>
{{research}}        </p>
      </section>

      <section class="news">
        <h2>Recent News</h2>
        <div class="news-scroll">
{{news}}        </div>
      </section>

      <section class="section-header">
        <h2>Projects</h2>
      </section>

{{projects}}      </section>

      <footer class="site-footer">
        <p>
          Last updated {{updated}} &nbsp;/&nbsp;
          <a href="https://github.com/jonbarron/jonbarron.github.io">Template from Jon Barron</a>
        </p>
      </footer>
    </main>

    <script>
      document.querySelectorAll('.paper').forEach(function(card) {
        var thumb = card.querySelector('.one');
        if (!thumb) return;
        var video = thumb.querySelector('.two video');
        if (video && window.matchMedia('(hover: hover)').matches) {
          card.addEventListener('mouseenter', function() { video.play().catch(function() {}); });
          card.addEventListener('mouseleave', function() { video.pause(); });
        }
        var moved = false;
        thumb.addEventListener('touchstart', function() { moved = false; }, {passive: true});
        thumb.addEventListener('touchmove', function() { moved = true; }, {passive: true});
        thumb.addEventListener('touchend', function() {
          if (moved) return;
          var active = !card.classList.contains('hover-active');
          document.querySelectorAll('.paper.hover-active').forEach(function(other) {
            other.classList.remove('hover-active');
            var ov = other.querySelector('.two video');
            if (ov) ov.pause();
          });
          if (active) {
            card.classList.add('hover-active');
            if (video) video.play().catch(function() {});
          }
        }, {passive: true});
      });
    </script>

    <script>
      // Photo "denoising" animation: on hover (or tap on touch screens) the photo
      // starts as colorful static and is gradually denoised back into the photo,
      // loosely like a diffusion model's sampler.
      (function() {
        var link = document.querySelector('.bio-photo a');
        var img = link && link.querySelector('img');
        if (!img) return;

        var canvas = document.createElement('canvas');
        canvas.className = 'denoise';
        canvas.setAttribute('aria-hidden', 'true');
        link.appendChild(canvas);
        var ctx = canvas.getContext('2d');

        var GRAIN = 192;  // noise resolution; lower = chunkier, more cartoony
        var noise = document.createElement('canvas');
        noise.width = noise.height = GRAIN;
        var nctx = noise.getContext('2d');
        var pixels = nctx.createImageData(GRAIN, GRAIN);
        var running = false;

        function fillNoise() {
          var d = pixels.data;
          for (var i = 0; i < d.length; i += 4) {
            d[i] = Math.random() * 256;
            d[i + 1] = Math.random() * 256;
            d[i + 2] = Math.random() * 256;
            d[i + 3] = 255;
          }
          nctx.putImageData(pixels, 0, 0);
        }

        function play() {
          if (running || !img.complete || !img.naturalWidth) return;
          running = true;
          canvas.style.left = img.offsetLeft + 'px';
          canvas.style.top = img.offsetTop + 'px';
          canvas.style.width = img.offsetWidth + 'px';
          canvas.style.height = img.offsetHeight + 'px';
          var w = canvas.width = 256;
          var h = canvas.height = Math.round(256 * img.offsetHeight / img.offsetWidth);
          var start = null, duration = 1400, lastNoise = -Infinity;
          canvas.style.opacity = 1;

          function frame(now) {
            if (start === null) start = now;
            var p = Math.min((now - start) / duration, 1);
            var level = Math.cos(p * Math.PI / 2);  // 1 = pure noise, 0 = clean photo
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, w, h);
            ctx.filter = 'blur(' + (4 * level).toFixed(2) + 'px)';
            ctx.drawImage(img, 0, 0, w, h);
            ctx.filter = 'none';
            if (now - lastNoise > 120) {  // new static ~8 times a second, not every frame
              fillNoise();
              lastNoise = now;
            }
            ctx.imageSmoothingEnabled = false;
            ctx.globalAlpha = 0.85 * level;
            ctx.drawImage(noise, 0, 0, w, h);
            ctx.globalAlpha = 1;
            if (p < 1) {
              requestAnimationFrame(frame);
            } else {
              canvas.style.opacity = 0;
              running = false;
            }
          }
          requestAnimationFrame(frame);
        }

        if (window.matchMedia('(hover: hover)').matches) {
          link.addEventListener('mouseenter', play);
        } else {
          // Touch screens: a tap plays the animation instead of opening the full-size photo.
          link.addEventListener('click', function(e) { e.preventDefault(); play(); });
        }
      })();
    </script>
  </body>
</html>
