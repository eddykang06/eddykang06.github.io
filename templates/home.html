<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Eddy Kang</title>
    <meta name="author" content="Eddy Kang">
    <meta name="description" content="Eddy Kang — Harvard student interested in machine learning and generative modeling for problems in biology.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta property="og:title" content="Eddy Kang">
    <meta property="og:description" content="Harvard student interested in machine learning and generative modeling for problems in biology.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eddykang06.github.io/">
    <meta property="og:image" content="https://eddykang06.github.io/images/face.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Eddy Kang">
    <meta name="twitter:description" content="Harvard student interested in machine learning and generative modeling for problems in biology.">
    <meta name="twitter:image" content="https://eddykang06.github.io/images/face.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
  </head>

  <body>
    <main class="page">
      <header class="bio">
        <div class="bio-text">
          <h1 class="name">Eddy Kang</h1>
{{bio}}          <p class="bio-links">
{{links}}          </p>
        </div>
        <div class="bio-photo">
          <a href="images/face.jpg"><img src="images/face.jpg" alt="Eddy Kang"></a>
        </div>
      </header>

      <section class="section-header">
        <h2>Research</h2>
        <p>
{{research}}        </p>
      </section>

      <section class="news">
        <h2>Recent News</h2>
        <div class="news-scroll">
{{news}}        </div>
      </section>

      <section class="section-header">
        <h2>Projects</h2>
      </section>

      <section class="papers">
{{projects}}      </section>

      <footer class="site-footer">
        <p>
          <a href="https://github.com/jonbarron/jonbarron.github.io">Template from Jon Barron</a>
        </p>
      </footer>
    </main>

    <script>
      document.querySelectorAll('.paper').forEach(function(card) {
        var thumb = card.querySelector('.one');
        if (!thumb) return;
        var video = thumb.querySelector('.two video');
        if (video && window.matchMedia('(hover: hover)').matches) {
          card.addEventListener('mouseenter', function() { video.play().catch(function() {}); });
          card.addEventListener('mouseleave', function() { video.pause(); });
        }
        var moved = false;
        thumb.addEventListener('touchstart', function() { moved = false; }, {passive: true});
        thumb.addEventListener('touchmove', function() { moved = true; }, {passive: true});
        thumb.addEventListener('touchend', function() {
          if (moved) return;
          var active = !card.classList.contains('hover-active');
          document.querySelectorAll('.paper.hover-active').forEach(function(other) {
            other.classList.remove('hover-active');
            var ov = other.querySelector('.two video');
            if (ov) ov.pause();
          });
          if (active) {
            card.classList.add('hover-active');
            if (video) video.play().catch(function() {});
          }
        }, {passive: true});
      });
    </script>
  </body>
</html>
